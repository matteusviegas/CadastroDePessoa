trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package -DskipTests'
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              mavenVersionOption: 'Default'

          - publish: '$(System.DefaultWorkingDirectory)/target'
            artifact: drop

  - stage: Release
    dependsOn: Build
    jobs:
      - job: Release
        steps:
          - download: current
            artifact: drop

          - script: echo "Deploy realizado no Azure App Service com banco OCI Autonomous Database"
            displayName: "Release"